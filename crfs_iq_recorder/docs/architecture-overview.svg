<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">CRFS IQ Recorder system overview</title>
  <desc id="desc">Operator uses the Recorder GUI. The GUI talks HTTP and SFTP to a CRFS Node, writes WAVE files to a local folder, optionally logs Excel, and the Converter reads those WAVE files to make a PNG.</desc>
  <rect width="1100" height="640" fill="#f4f7fb"/>
  <text x="40" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1b2430">CRFS IQ Recorder - system overview (v1.8.3)</text>
  <text x="40" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b7c">This PC - sensor on the local network - no addresses or passwords in this diagram</text>

  <rect x="40" y="90" width="160" height="64" rx="10" fill="#ffffff" stroke="#2f6f8f" stroke-width="1.5"/>
  <text x="120" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b2430">Operator</text>
  <text x="120" y="136" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5b6b7c">Start, browse, download</text>

  <rect x="240" y="80" width="380" height="360" rx="12" fill="#ffffff" stroke="#c5d0da"/>
  <text x="430" y="104" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1b2430">Recorder process (Qt)</text>

  <rect x="260" y="124" width="340" height="52" rx="8" fill="#e8f4fb" stroke="#2f6f8f"/>
  <text x="430" y="146" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b2430">MainWindow</text>
  <text x="430" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5b6b7c">Validate, EMP POST, series, Excel queue</text>

  <rect x="260" y="190" width="160" height="52" rx="8" fill="#eef6f1" stroke="#3d7a5a"/>
  <text x="340" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1b2430">EmpClient</text>
  <text x="340" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6b7c">HTTP worker thread</text>

  <rect x="440" y="190" width="160" height="52" rx="8" fill="#eef6f1" stroke="#3d7a5a"/>
  <text x="520" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1b2430">SftpWindow</text>
  <text x="520" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6b7c">List / get / preview</text>

  <rect x="260" y="258" width="160" height="52" rx="8" fill="#f7f1e8" stroke="#8a6a32"/>
  <text x="340" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1b2430">SftpBackend</text>
  <text x="340" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6b7c">One SSH for browse</text>

  <rect x="440" y="258" width="160" height="52" rx="8" fill="#f7f1e8" stroke="#8a6a32"/>
  <text x="520" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1b2430">Download / preview</text>
  <text x="520" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6b7c">Own SFTP threads</text>

  <rect x="260" y="326" width="340" height="90" rx="8" fill="#f3f0f8" stroke="#6b5b8a"/>
  <text x="430" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1b2430">On this PC</text>
  <text x="430" y="372" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5b6b7c">Protected settings - recording history</text>
  <text x="430" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5b6b7c">Pending Excel JSON - preview cache (RAM)</text>

  <rect x="700" y="90" width="360" height="150" rx="12" fill="#ffffff" stroke="#c5d0da"/>
  <text x="880" y="114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1b2430">CRFS RFeye Node</text>
  <rect x="720" y="132" width="150" height="84" rx="8" fill="#e8f4fb" stroke="#2f6f8f"/>
  <text x="795" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1b2430">HTTP EMP</text>
  <text x="795" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6b7c">POST /emp/</text>
  <rect x="890" y="132" width="150" height="84" rx="8" fill="#e8f4fb" stroke="#2f6f8f"/>
  <text x="965" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1b2430">Sensor disk</text>
  <text x="965" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6b7c">/mnt/1/remdata/</text>
  <text x="965" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6b7c">SFTP</text>

  <rect x="700" y="270" width="170" height="84" rx="10" fill="#ffffff" stroke="#3d7a5a" stroke-width="1.5"/>
  <text x="785" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1b2430">Local WAVE files</text>
  <text x="785" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6b7c">Recordings folder</text>

  <rect x="890" y="270" width="170" height="84" rx="10" fill="#ffffff" stroke="#8a6a32" stroke-width="1.5"/>
  <text x="975" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1b2430">Excel workbook</text>
  <text x="975" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6b7c">Optional collection log</text>

  <rect x="700" y="390" width="360" height="100" rx="12" fill="#ffffff" stroke="#c5d0da"/>
  <text x="880" y="422" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1b2430">IQ Spectrogram Converter</text>
  <text x="880" y="444" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b7c">Separate process - stereo WAV to PNG</text>
  <text x="880" y="464" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5b6b7c">No live sensor session - IF axis +/- fs/2</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5b6b7c"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f6f8f"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3d7a5a"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a6a32"/>
    </marker>
  </defs>
  <line x1="200" y1="122" x2="236" y2="150" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="176" x2="340" y2="188" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="176" x2="520" y2="188" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="242" x2="340" y2="256" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="242" x2="520" y2="256" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="216" x2="716" y2="174" stroke="#2f6f8f" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="530" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2f6f8f">HTTP</text>
  <line x1="600" y1="216" x2="886" y2="174" stroke="#2f6f8f" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="740" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#2f6f8f">SFTP</text>
  <line x1="600" y1="284" x2="696" y2="310" stroke="#3d7a5a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="600" y1="370" x2="886" y2="312" stroke="#8a6a32" stroke-width="1.5" marker-end="url(#arrow-gold)"/>
  <line x1="785" y1="354" x2="785" y2="388" stroke="#5b6b7c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b6b7c">WAV</text>

  <text x="40" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1b2430">Notes</text>
  <text x="40" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b7c">The Node writes IQ. This app requests, lists, downloads, and labels.</text>
  <text x="40" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b7c">HTTP accept is not file completion. Confirmed means matching WAVE parts with a stable SFTP size.</text>
  <text x="40" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b7c">Download and waterfall are operator actions. Excel logging is optional.</text>
  <text x="40" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b7c">See ARCHITECTURE.md for threads, matching, and what is unverified.</text>
  <text x="40" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8a96a3">CRFS IQ Recorder 1.8.3 - portable paths only</text>
</svg>
